<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fafaf9" />
  <script>
    // Apply the saved or system theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('sketchsync:theme');
      if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
  <meta name="description"
    content="SketchSync is a realtime whiteboard your AI can draw on. Sketch with your team and connect Claude, Cursor or any MCP client to add diagrams, flowcharts and math live." />
  <meta name="keywords"
    content="whiteboard app, online whiteboard, collaborative drawing, diagram tool, brainstorming app, SketchSync" />
  <meta name="author" content="Indrajit sahani" />
  <meta name="designer" content="Indrajit Sahani">

  <!-- Open Graph / Facebook -->
  <meta property="og:title" content="SketchSync - Collaborative Online Whiteboard" />
  <meta property="og:description"
    content="SketchSync lets you collaborate, draw, and brainstorm in real-time with your team." />
  <meta property="og:image" content="/images/sketchsync-preview.png" />
  <meta property="og:url" content="https://sketchsync.app" />
  <meta property="og:type" content="website" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SketchSync - Collaborative Online Whiteboard" />
  <meta name="twitter:description"
    content="Join the ultimate collaborative whiteboard experience. Brainstorm, draw, and create in sync with your team." />
  <meta name="twitter:image" content="/images/sketchsync-preview.png" />

  <!-- Favicon and Icons -->
  <link rel="author" href="https://indrajitsahani.com/" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <title>SketchSync · The whiteboard your AI can draw on</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
